services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ./app:/code/app
      - ./data:/code/data
      - ./chroma_db:/code/chroma_db
      - hf_cache:/hf_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  hf_cache:
